name: school-inventory

# Общие настройки микросервисов на .NET.
x-dotnet-service: &dotnet-service
  restart: unless-stopped
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy

x-common-env: &common-env
  ASPNETCORE_ENVIRONMENT: Production
  Jwt__Issuer: school-inventory
  Jwt__Audience: school-inventory-api
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?Задайте JWT_SIGNING_KEY в файле .env}
  Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-30}
  Kafka__Enabled: ${KAFKA_ENABLED:-true}
  Kafka__BootstrapServers: kafka:9092
  Kafka__AuditTopic: audit-events
  WorkingHours__TimeZone: ${WORK_TIMEZONE:-Europe/Moscow}
  WorkingHours__StartHour: ${WORK_START_HOUR:-8}
  WorkingHours__EndHour: ${WORK_END_HOUR:-18}
  WorkingHours__WorkDays: ${WORK_DAYS:-Mon,Tue,Wed,Thu,Fri}

services:
  # Единственная точка входа: HTTPS + перенаправление с HTTP (SR-04).
  gateway:
    build:
      context: .
      dockerfile: src/Inventory.Gateway/Dockerfile
    image: school-inventory/gateway
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:8443"
      - "${HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Gateway__PublicHttpsPort: ${HTTPS_PORT:-8443}
      Gateway__Certificate__Path: /https/gateway.pfx
      Gateway__Certificate__Password: ${CERT_PASSWORD:-}
    volumes:
      - gateway-certs:/https
    networks: [frontend, backend]
    depends_on:
      - auth-service
      - device-service
      - request-service
      - audit-service

  auth-service:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/Inventory.AuthService/Dockerfile
    image: school-inventory/auth-service
    environment:
      <<: *common-env
      ConnectionStrings__Default: Host=postgres;Database=auth_db;Username=auth_svc;Password=${AUTH_DB_PASSWORD:?Задайте AUTH_DB_PASSWORD}
      Services__DeviceService: http://device-service:8080/
      Admin__Login: ${ADMIN_LOGIN:-admin}
      Admin__Password: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD}
      Admin__FullName: ${ADMIN_FULL_NAME:-Системный администратор}
      Seed__DemoUsers: ${SEED_DEMO_DATA:-false}
      Seed__DemoPassword: ${DEMO_PASSWORD:-}

  device-service:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/Inventory.DeviceService/Dockerfile
    image: school-inventory/device-service
    environment:
      <<: *common-env
      ConnectionStrings__Default: Host=postgres;Database=device_db;Username=device_svc;Password=${DEVICE_DB_PASSWORD:?Задайте DEVICE_DB_PASSWORD}
      Seed__DemoDevices: ${SEED_DEMO_DATA:-false}

  request-service:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/Inventory.RequestService/Dockerfile
    image: school-inventory/request-service
    environment:
      <<: *common-env
      ConnectionStrings__Default: Host=postgres;Database=request_db;Username=request_svc;Password=${REQUEST_DB_PASSWORD:?Задайте REQUEST_DB_PASSWORD}
      Services__DeviceService: http://device-service:8080/

  audit-service:
    <<: *dotnet-service
    build:
      context: .
      dockerfile: src/Inventory.AuditService/Dockerfile
    image: school-inventory/audit-service
    environment:
      <<: *common-env
      ConnectionStrings__Default: Host=postgres;Database=audit_db;Username=audit_svc;Password=${AUDIT_DB_PASSWORD:?Задайте AUDIT_DB_PASSWORD}
      Kafka__ConsumerGroup: audit-service

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DEVICE_DB_PASSWORD: ${DEVICE_DB_PASSWORD}
      REQUEST_DB_PASSWORD: ${REQUEST_DB_PASSWORD}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [backend]

networks:
  # Внешняя сеть: только шлюз публикует порты на хост.
  frontend: {}
  # Внутренняя сеть без выхода наружу: сервисы, PostgreSQL и Kafka недоступны с хоста напрямую.
  backend:
    internal: true

volumes:
  pgdata: {}
  kafka-data: {}
  gateway-certs: {}
